name: Weekly Event Harvest

on:
  # Run every Monday at 9 AM Pacific Time (5 PM UTC)
  schedule:
    - cron: '0 17 * * 1'

  # Allow manual triggering
  workflow_dispatch:

# The built-in GITHUB_TOKEN is read-only by default. The harvest commits its
# results straight to main, where the admin page's Pending Events tab reads them.
permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      # Harvest scripts format times in the runner's local zone.
      TZ: America/Los_Angeles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Each run builds a fresh pending list. Events still listed by their source
      # are found again; events already approved are skipped.
      - name: Start a fresh pending list
        run: |
          echo '{ "events": [] }' > data/events-pending.json

      - name: Run HTML page harvester
        run: node scripts/harvest-html-pages.js
        continue-on-error: true

      - name: Run ICS feed harvester
        run: node scripts/harvest-ics-feeds.js
        continue-on-error: true

      - name: Validate calendar data
        run: npm run validate

      - name: Commit results to main
        run: |
          COUNT=$(node -e "console.log(require('./data/events-pending.json').events?.length || 0)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events-pending.json data/events.json
          if git diff --cached --quiet; then
            echo "No changes from this harvest."
            exit 0
          fi
          git commit -m "Weekly harvest: $COUNT events pending review" \
            -m "Review in the admin page, Pending Events tab: https://oregonstartupeventscalendar.netlify.app/admin.html" \
            -m "🤖 Generated by weekly harvest workflow"
          # Admin edits may have landed on main while the harvest ran.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### $COUNT events pending review" >> $GITHUB_STEP_SUMMARY
