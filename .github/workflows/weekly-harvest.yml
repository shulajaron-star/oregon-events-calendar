name: Weekly Event Harvest

on:
  # Run every Monday at 9 AM Pacific Time (5 PM UTC)
  schedule:
    - cron: '0 17 * * 1'

  # Allow manual triggering
  workflow_dispatch:

# The built-in GITHUB_TOKEN is read-only by default. The harvest needs to
# push a branch and open a pull request with the results.
permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run HTML page harvester
        run: node scripts/harvest-html-pages.js
        continue-on-error: true

      - name: Run ICS feed harvester
        run: node scripts/harvest-ics-feeds.js
        continue-on-error: true

      - name: Check for new pending events
        id: check_pending
        run: |
          if [ -f data/events-pending.json ]; then
            COUNT=$(node -e "const data=require('./data/events-pending.json'); console.log(data.events?.length || 0)")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 0 ]; then
              echo "has_pending=true" >> $GITHUB_OUTPUT
            else
              echo "has_pending=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with pending events
        if: steps.check_pending.outputs.has_pending == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Weekly harvest: ${{ steps.check_pending.outputs.count }} new events pending review

            Discovered ${{ steps.check_pending.outputs.count }} new events from approved sources.
            Review at: https://oregonstartupeventscalendar.netlify.app/admin.html

            🤖 Generated by weekly harvest workflow
          branch: weekly-harvest-${{ github.run_number }}
          title: 'Weekly Harvest: ${{ steps.check_pending.outputs.count }} events pending review'
          body: |
            ## Weekly Event Harvest Results

            **Found**: ${{ steps.check_pending.outputs.count }} new events

            ### Review Process
            1. Go to [Admin Interface](https://oregonstartupeventscalendar.netlify.app/admin.html)
            2. Click the **Pending Events** tab
            3. Review each event and click **Approve** or **Reject**

            ### What was harvested
            - Scraped all active sources in `data/sources.json`
            - Filtered to events matching scope rules
            - Deduplicated against existing events
            - New events saved to `data/events-pending.json`

            **Do not merge this PR directly**. Instead, approve/reject events through the admin interface. This PR is for tracking purposes only.

            🤖 Generated by weekly harvest workflow
          labels: |
            weekly-harvest
            pending-review

      - name: No new events found
        if: steps.check_pending.outputs.has_pending == 'false'
        run: echo "No new pending events found in this harvest run"
